name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Test
        run: bash tests/run.sh
      - name: Build package
        run: bash scripts/package.sh --repo "$GITHUB_REPOSITORY"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="dist/linux-dev-setup-v$(cat VERSION).tar.gz"
          gh release create "$GITHUB_REF_NAME" dist/install.sh "$package" "$package.sha256" --verify-tag --generate-notes
