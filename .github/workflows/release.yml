name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Test
        run: bash tests/run.sh
      - name: Build package
        run: bash scripts/package.sh --repo "$GITHUB_REPOSITORY"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/install.sh dist/*.tar.gz dist/*.sha256 --verify-tag --generate-notes
